<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Music Bot — Discord, Python, yt-dlp, ffmpeg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#1d2a52"/>
      <stop offset="100%" stop-color="#5865F2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8ea1ff"/>
      <stop offset="100%" stop-color="#5ef0c0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="1050" cy="60" r="180" fill="#ffffff" opacity="0.05"/>
  <circle cx="140" cy="300" r="220" fill="#ffffff" opacity="0.04"/>

  <g transform="translate(96 108)">
    <rect x="0" y="0" width="84" height="84" rx="22" fill="#ffffff" opacity="0.10"/>
    <path d="M52 18v34a12 12 0 1 1-7-10.8V26l-16 4v30a12 12 0 1 1-7-10.8V24a4 4 0 0 1 3.1-3.9l22-5.5a3 3 0 0 1 4.9 3z"
          fill="url(#accent)"/>
  </g>

  <text x="212" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="62" font-weight="700"
        fill="#ffffff">Music Bot</text>
  <text x="214" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#c9d3ff">
    Музыкальный бот для Discord — очередь, кнопки, поиск, плейлисты
  </text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#0b1020">
    <rect x="214" y="222" width="112" height="34" rx="17" fill="#5ef0c0" opacity="0.9"/>
    <text x="270" y="244" text-anchor="middle">Python 3.11+</text>
    <rect x="338" y="222" width="124" height="34" rx="17" fill="#8ea1ff" opacity="0.9"/>
    <text x="400" y="244" text-anchor="middle">discord.py 2.7</text>
    <rect x="474" y="222" width="92" height="34" rx="17" fill="#ffffff" opacity="0.85"/>
    <text x="520" y="244" text-anchor="middle">yt-dlp</text>
    <rect x="578" y="222" width="92" height="34" rx="17" fill="#ffffff" opacity="0.85"/>
    <text x="624" y="244" text-anchor="middle">ffmpeg</text>
  </g>
